name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for Home Assistant 2026.9.4
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
          cache: 'pip'
          cache-dependency-path: |
            requirements_test.txt
            custom_components/open_epaper_link/manifest.json

      - name: Install test and integration dependencies
        run: |
          python -m pip install -r requirements_test.txt
          python -c 'import json, subprocess, sys; manifest = json.load(open("custom_components/open_epaper_link/manifest.json")); subprocess.check_call([sys.executable, "-m", "pip", "install", *manifest["requirements"]])'

      - name: Run tests
        run: python -m pytest tests -v
